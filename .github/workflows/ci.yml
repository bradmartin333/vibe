name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Verify app imports and loads
        run: uv run python -c "from meditation.game import run; print('OK')"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pythonanywhere
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Assemble web sources
        run: |
          mkdir -p build/vibe
          cp -r main.py meditation build/vibe/

      - name: Build WebAssembly bundle with pygbag
        run: >-
          uvx pygbag==0.9.3
          --PYBUILD 3.14 --ume_block 0
          --template web/vibe.tmpl --icon web/favicon.png --title "v i b e"
          --build build/vibe

      - name: Deploy to PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PA_DOMAIN }}
        run: uv run scripts/deploy_pythonanywhere.py build/vibe/build/web
